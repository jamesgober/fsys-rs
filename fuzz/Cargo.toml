# cargo-fuzz workspace for fsys (locked decision D-7 — pragmatic
# mode). Build with `cargo fuzz build`; run targets with `cargo fuzz
# run <target>`. Full-duration runs (1M iterations or 1 hour) are
# documented protocol in `.dev/DECISIONS-0.6.0.md`; dev iteration
# uses `--max_total_time=60` for a quick sanity pass.

[package]
name = "fsys-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fsys = { path = ".." }

[[bin]]
name = "path_normalize"
path = "fuzz_targets/path_normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "glob_pattern"
path = "fuzz_targets/glob_pattern.rs"
test = false
doc = false
bench = false

[[bin]]
name = "batch_builder"
path = "fuzz_targets/batch_builder.rs"
test = false
doc = false
bench = false

# 0.9.0 R-2 — journal frame format fuzzing. Validates encoder/decoder
# round-trip + decoder safety on arbitrary input. Requires the parent
# crate's `fuzz` feature so the pub(crate) frame helpers are exposed
# via the __fuzz internal-API module.
[[bin]]
name = "journal_frame"
path = "fuzz_targets/journal_frame.rs"
test = false
doc = false
bench = false
required-features = ["fuzz"]

# 0.9.7 audit M-7 — journal append-path fuzzing.
# Drives the end-to-end append → sync → close → reopen → decode
# round-trip with length-prefixed records of fuzzer-chosen sizes.
[[bin]]
name = "journal_append"
path = "fuzz_targets/journal_append.rs"
test = false
doc = false
bench = false

# 0.9.7 audit M-7 — batch commit dispatcher fuzzing.
# Builds and commits a batch with adversarial paths + payloads
# against a per-iteration tmpdir.
[[bin]]
name = "batch_writes"
path = "fuzz_targets/batch_writes.rs"
test = false
doc = false
bench = false

# 0.9.7 audit M-7 — aligned-buffer-pool stress via Direct-IO.
# Cycles Direct writes with boundary-case payload sizes (0 / 1
# / sector ± 1 / N×sector) to stress the pool's lease/return cycle.
[[bin]]
name = "aligned_pool_stress"
path = "fuzz_targets/aligned_pool_stress.rs"
test = false
doc = false
bench = false

[features]
# Enables the parent crate's `fuzz` feature, which in turn exposes
# `pub(crate)` frame helpers via the `__fuzz` module so the harness
# can reach them.
fuzz = ["fsys/fuzz"]
