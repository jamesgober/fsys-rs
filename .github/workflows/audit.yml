name: Security audit

# 0.9.6 audit H-14 — supply-chain hygiene.
#
# Runs on push, PR, daily schedule (so new RUSTSEC advisories are
# surfaced even when no PRs are in flight), and on manual dispatch.
# Failures here are advisory in PRs (won't block merge unless a
# CVE lands on a direct dep) but DO surface in the workflow log
# so the maintainer sees them immediately.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  schedule:
    # Daily at 08:30 UTC — checks new advisories independent of PRs.
    - cron: "30 8 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: cargo audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo audit
        run: cargo audit --deny warnings

  cargo-deny:
    name: cargo deny (licenses, sources, bans, advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny
        run: cargo deny check
