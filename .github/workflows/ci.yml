name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }} / stable)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Test
        run: cargo test --all-targets --verbose

      - name: Doc test
        run: cargo test --doc --verbose

  msrv:
    name: MSRV (1.75) — library only
    runs-on: ubuntu-latest
    # MSRV verification only needs the library itself to compile on the
    # minimum supported Rust version. Dev-dependencies (criterion → clap)
    # ship with their own, independent MSRVs and pull in transitive
    # crates that may require a newer edition; their compatibility is
    # not part of fsys's MSRV contract. Building `--lib` skips dev-deps
    # entirely and validates exactly what the MSRV declaration in
    # `Cargo.toml` (`rust-version = "1.75"`) actually means.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.75 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build library
        run: cargo build --lib --verbose

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --no-deps --all-features

  # 0.9.6 audit L-5 — short-budget soak test in default CI.
  # The `stress` feature flips the soak test to the full 1-hour
  # run; without the feature the same test self-bounds to ~60s.
  # 60s is fast enough for every-PR validation and catches
  # obvious deadlocks before they reach release.
  soak-short:
    name: Soak (60s budget)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Run soak test (default 60s budget)
        run: cargo test --test stress --release

  # 0.9.6 audit H-13 — feature-matrix coverage.
  # The default + all-features paths are exercised by the `test` /
  # `docs` jobs above; this matrix covers the in-between
  # combinations so a regression in any optional-feature gate
  # surfaces in CI rather than at user side.
  feature-matrix:
    name: Feature matrix (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features async"
          - "--no-default-features --features tracing"
          - "--no-default-features --features async,tracing"
          - "--features stress"
          - "--features fuzz"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --lib --tests ${{ matrix.features }}

      - name: Test
        run: cargo test --lib ${{ matrix.features }}

  # 0.9.7 audit H-7 — OOM-injection coverage.
  # The `oom_inject` feature replaces the global allocator with a
  # forwarding wrapper that injects allocation failures above a
  # thread-local size threshold. It is an internal-only test
  # feature (documented "NEVER enable in production builds") and
  # must run in its own job because `#[global_allocator]` is a
  # crate-wide attribute — enabling it for the rest of the test
  # suite would pay the per-allocation threshold check on every
  # test, slowing CI without value. Runs on every supported OS
  # because the cross-platform smoke + guard + buffered-mode tests
  # exercise allocator pass-through identically on each platform;
  # the Direct-mode test is itself `#[cfg(target_os = "linux")]`
  # because Windows / macOS silently downgrade `direct(true)` when
  # the temp filesystem rejects elite open flags, breaking the
  # determinism the test needs.
  oom-inject:
    name: OOM injection (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build oom_injection test
        run: cargo build --features oom_inject --test oom_injection --verbose

      - name: Run oom_injection test
        run: cargo test --features oom_inject --test oom_injection --verbose
